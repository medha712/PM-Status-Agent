<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PM Status Agent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .metric {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            margin: 15px 0;
        }

        .metric-label {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }

        .status-good {
            color: #10b981;
        }

        .status-warning {
            color: #f59e0b;
        }

        .status-critical {
            color: #ef4444;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        button:hover {
            background: #764ba2;
        }

        .query-box {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .query-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .query-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .report {
            background: white;
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .report-content {
            color: #333;
            line-height: 1.8;
            font-size: 14px;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f4f6;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .blocker-item {
            border-left: 4px solid #ef4444;
            padding-left: 15px;
            margin: 15px 0;
            padding: 10px;
            background: #fef2f2;
            border-radius: 4px;
        }

        .memory-widget {
            background: #f0f9ff;
            border-left: 4px solid #0ea5e9;
            padding: 15px;
            border-radius: 4px;
            margin: 15px 0;
        }

        .success {
            color: #10b981;
        }

        .warning {
            color: #f59e0b;
        }

        .error {
            color: #ef4444;
        }

        .trend-up {
            color: #10b981;
        }

        .trend-down {
            color: #ef4444;
        }

        .trend-neutral {
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Project Management Status Agent</h1>
            <p class="subtitle">Real-time sprint tracking, blocker identification, and risk analysis</p>
        </header>

        <div class="grid">
            <div class="card">
                <div class="card-title">🎯 Current Status</div>
                <div class="metric" id="health-metric">--</div>
                <div class="metric-label">Health Score</div>
                <div id="health-status" style="margin-top: 10px; font-size: 14px;"></div>
            </div>

            <div class="card">
                <div class="card-title">🚨 Blockers</div>
                <div class="metric" id="blockers-count">--</div>
                <div class="metric-label">Active Blockers</div>
                <button onclick="loadReport('stuck')">View Stuck Items</button>
            </div>

            <div class="card">
                <div class="card-title">⚠️ Risk Level</div>
                <div class="metric" id="risk-level">--</div>
                <div class="metric-label">Current Risk</div>
                <button onclick="loadReport('risk')">Risk Assessment</button>
            </div>
        </div>

        <div class="query-box">
            <h2 style="margin-bottom: 15px;">🤖 Ask the Agent</h2>
            <input type="text" id="query-input" class="query-input"
                   placeholder="Ask anything: 'What's been stuck?' 'Show me risks' 'Weekly status' etc.">
            <div class="button-group">
                <button onclick="submitQuery()">Ask</button>
                <button onclick="loadReport('weekly')">Weekly Report</button>
                <button onclick="loadReport('risk')">Risk Report</button>
                <button onclick="loadReport('stuck')">Stuck Items</button>
                <button onclick="loadMemory()">Memory Summary</button>
            </div>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading data...</p>
        </div>

        <div id="report-container"></div>
    </div>

    <script>
        // Load initial status
        window.onload = () => {
            loadStatus();
        };

        function showLoading(show = true) {
            document.getElementById('loading').classList.toggle('active', show);
        }

        function loadStatus() {
            showLoading(true);
            fetch('/api/status')
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        const health = data.health;
                        document.getElementById('health-metric').textContent = health.score + '%';
                        document.getElementById('health-status').innerHTML =
                            `<span class="${health.score >= 75 ? 'success' : health.score >= 60 ? 'warning' : 'error'}">
                            ${health.status}</span> ${health.trend}`;

                        document.getElementById('blockers-count').textContent = data.blockers_count;

                        // Determine risk level
                        let riskLevel = health.score >= 75 ? '✅ Low' : health.score >= 60 ? '🟡 Medium' : '🔴 High';
                        document.getElementById('risk-level').innerHTML = riskLevel;
                    }
                    showLoading(false);
                })
                .catch(e => {
                    console.error(e);
                    showLoading(false);
                });
        }

        function loadReport(type) {
            showLoading(true);
            const endpoint = `/api/report/${type}`;

            fetch(endpoint)
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        displayReport(data.report, type);
                    }
                    showLoading(false);
                })
                .catch(e => {
                    console.error(e);
                    showLoading(false);
                });
        }

        function loadMemory() {
            showLoading(true);
            fetch('/api/memory')
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        displayMemory(data);
                    }
                    showLoading(false);
                })
                .catch(e => {
                    console.error(e);
                    showLoading(false);
                });
        }

        function submitQuery() {
            const query = document.getElementById('query-input').value;
            if (!query.trim()) return;

            showLoading(true);
            fetch('/api/query', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query })
            })
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        displayReport(data.report, 'custom');
                    }
                    showLoading(false);
                })
                .catch(e => {
                    console.error(e);
                    showLoading(false);
                });
        }

        function displayReport(report, type) {
            const container = document.getElementById('report-container');
            container.innerHTML = `<div class="report"><div class="report-content">${escapeHtml(report)}</div></div>`;
        }

        function displayMemory(data) {
            const health = data.health_score;
            const blockers = data.blocker_analysis;
            const chronic = data.chronic_blockers;

            let html = `<div class="report">`;
            html += `<div class="card-title">📚 Memory Summary</div>`;
            html += `<div class="memory-widget">`;
            html += `<strong>Health Score:</strong> ${health.score}% (${health.status}) ${health.trend}<br>`;
            html += `<strong>Blocker Trend:</strong> ${blockers.trend} - ${blockers.recommendation}<br>`;
            html += `<strong>Data Points:</strong> ${data.snapshots} weekly snapshots<br>`;

            if (chronic.length > 0) {
                html += `<strong>Chronic Blockers (2+ weeks):</strong><br>`;
                chronic.slice(0, 5).forEach(item => {
                    html += `<div class="blocker-item">
                        <strong>${item.title}</strong><br>
                        <small>${item.weeks_stuck} weeks • ${item.source} • ${item.type}</small>
                    </div>`;
                });
            } else {
                html += `<strong>Chronic Blockers:</strong> None detected ✅`;
            }

            html += `</div>`;
            html += `<pre style="margin-top: 20px; background: #f3f4f6; padding: 15px; border-radius: 4px; font-size: 12px;">${escapeHtml(data.summary)}</pre>`;
            html += `</div>`;

            document.getElementById('report-container').innerHTML = html;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Allow Enter key in query
        document.getElementById('query-input').addEventListener('keypress', e => {
            if (e.key === 'Enter') submitQuery();
        });
    </script>
</body>
</html>
