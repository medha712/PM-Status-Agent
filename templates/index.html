<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Manager - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #667eea;
            --primary-dark: #764ba2;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg: #0f172a;
            --bg-light: #1e293b;
            --bg-lighter: #334155;
            --text: #f1f5f9;
            --text-muted: #cbd5e1;
            --border: #475569;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, var(--primary-dark) 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        header {
            background: var(--bg-light);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 5px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Grid Layout */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        /* Metric Card */
        .metric-card {
            background: var(--bg-light);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .metric-card:hover {
            border-color: var(--primary);
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.2);
        }

        .metric-label {
            color: var(--text-muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .metric-value {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .metric-details {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 8px;
        }

        .status-good {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }

        .status-warning {
            background: rgba(245, 158, 11, 0.1);
            color: var(--warning);
        }

        .status-danger {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        /* Progress Bar */
        .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--bg-lighter);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 12px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            border-radius: 3px;
            transition: width 0.4s ease;
        }

        /* Charts Section */
        .charts-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-card {
            background: var(--bg-light);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        .chart-card h3 {
            margin-bottom: 20px;
            color: var(--text);
            font-size: 16px;
        }

        .chart-container {
            position: relative;
            height: 250px;
        }

        /* Blockers List */
        .blockers-section {
            background: var(--bg-light);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .blockers-section h2 {
            margin-bottom: 20px;
            font-size: 18px;
        }

        .blockers-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .blocker-item {
            background: var(--bg-lighter);
            border-left: 4px solid var(--danger);
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .blocker-item:hover {
            background: rgba(239, 68, 68, 0.1);
            transform: translateX(4px);
        }

        .blocker-title {
            font-weight: 600;
            margin-bottom: 8px;
        }

        .blocker-meta {
            display: flex;
            gap: 20px;
            font-size: 12px;
            color: var(--text-muted);
            flex-wrap: wrap;
        }

        .blocker-tag {
            background: rgba(102, 126, 234, 0.1);
            color: var(--primary);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
        }

        /* Query Section */
        .query-section {
            background: var(--bg-light);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .query-section h2 {
            margin-bottom: 15px;
            font-size: 18px;
        }

        .query-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .query-input {
            flex: 1;
            background: var(--bg-lighter);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .query-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .query-suggestions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
        }

        .suggestion-btn {
            background: var(--bg-lighter);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .suggestion-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        /* Button Styles */
        button {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        /* Loading */
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid var(--border);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Report Display */
        .report-display {
            background: var(--bg-light);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }

        .report-display.active {
            display: block;
        }

        .report-content {
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: var(--text);
            line-height: 1.6;
            max-height: 600px;
            overflow-y: auto;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .tab {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 12px 0;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Memory Widget */
        .memory-widget {
            background: rgba(102, 126, 234, 0.1);
            border: 1px solid var(--primary);
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            color: var(--text);
            font-size: 13px;
            line-height: 1.6;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-lighter);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-dark);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }

            .charts-section {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 24px;
            }

            .query-suggestions {
                grid-template-columns: 1fr;
            }
        }

        /* Animations */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .metric-card {
            animation: slideIn 0.5s ease forwards;
        }

        .metric-card:nth-child(2) {
            animation-delay: 0.1s;
        }

        .metric-card:nth-child(3) {
            animation-delay: 0.2s;
        }

        .metric-card:nth-child(4) {
            animation-delay: 0.3s;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>📊 Status Manager</h1>
            <p class="subtitle">Real-time project tracking with AI-powered insights</p>
        </header>

        <!-- Main Dashboard -->
        <div class="dashboard" id="dashboard">
            <div class="metric-card">
                <div class="metric-label">Health Score</div>
                <div class="metric-value" id="health-score">--</div>
                <div id="health-status"></div>
                <div class="progress-bar">
                    <div class="progress-fill" id="health-bar" style="width: 0%"></div>
                </div>
            </div>

            <div class="metric-card">
                <div class="metric-label">Active Blockers</div>
                <div class="metric-value" id="blocker-count">--</div>
                <div class="metric-details">
                    <span id="blocker-details">--</span>
                </div>
            </div>

            <div class="metric-card">
                <div class="metric-label">Completion Rate</div>
                <div class="metric-value" id="completion-rate">--</div>
                <div class="metric-details" id="completion-details">--</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="completion-bar" style="width: 0%; background: linear-gradient(90deg, #10b981, #059669);"></div>
                </div>
            </div>

            <div class="metric-card">
                <div class="metric-label">Risk Level</div>
                <div class="metric-value" id="risk-level">--</div>
                <div id="risk-details"></div>
            </div>
        </div>

        <!-- Charts -->
        <div class="charts-section">
            <div class="chart-card">
                <h3>Health Score Trend</h3>
                <div class="chart-container">
                    <canvas id="healthChart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h3>Blocker Timeline</h3>
                <div class="chart-container">
                    <canvas id="blockerChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Blockers Section -->
        <div class="blockers-section">
            <h2>Current Blockers</h2>
            <div class="blockers-list" id="blockers-list">
                <p style="color: var(--text-muted);">Loading blockers...</p>
            </div>
        </div>

        <!-- Query Section -->
        <div class="query-section">
            <h2>Ask the Agent</h2>
            <div class="query-input-group">
                <input type="text" id="query-input" class="query-input" placeholder="Ask anything: 'What's stuck?', 'Show risks', etc.">
                <button onclick="submitQuery()">Send</button>
            </div>

            <div class="query-suggestions">
                <button class="suggestion-btn" onclick="askAgent('What has been stuck for multiple weeks?')">
                    Stuck Items
                </button>
                <button class="suggestion-btn" onclick="askAgent('Show risk assessment')">
                    Risk Assessment
                </button>
                <button class="suggestion-btn" onclick="askAgent('Weekly status report')">
                    Weekly Report
                </button>
                <button class="suggestion-btn" onclick="askAgent('Show memory summary')">
                    Memory Summary
                </button>
                <button class="suggestion-btn" onclick="askAgent('What is blocking progress?')">
                    Top Blockers
                </button>
                <button class="suggestion-btn" onclick="askAgent('Show week-over-week trends')">
                    Trends
                </button>
            </div>
        </div>

        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Analyzing project data...</p>
        </div>

        <!-- Report Display -->
        <div class="report-display" id="report-display">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('report', event)">Report</button>
                <button class="tab" onclick="switchTab('memory', event)">Memory</button>
            </div>
            <div id="report" class="tab-content active">
                <div class="report-content" id="report-content"></div>
            </div>
            <div id="memory" class="tab-content">
                <div class="report-content" id="memory-content"></div>
            </div>
        </div>
    </div>

    <script>
        let healthChart, blockerChart;
        let currentTab = 'report';

        // Initialize on load
        window.onload = () => {
            setTimeout(() => {
                initCharts();
                loadDashboard();
            }, 100);
        };

        function showLoading(show = true) {
            document.getElementById('loading').classList.toggle('active', show);
        }

        function loadDashboard() {
            showLoading(true);
            fetch('/api/status')
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        updateMetrics(data);
                        loadBlockers();
                        loadTrends();
                    }
                    showLoading(false);
                })
                .catch(e => {
                    console.error(e);
                    showLoading(false);
                });
        }

        function updateMetrics(data) {
            const health = data.health;
            document.getElementById('health-score').textContent = health.score + '%';
            document.getElementById('health-bar').style.width = health.score + '%';

            const statusClass = health.score >= 75 ? 'status-good' : health.score >= 60 ? 'status-warning' : 'status-danger';
            document.getElementById('health-status').innerHTML =
                `<span class="status-badge ${statusClass}">${health.status}</span> ${health.trend}`;

            document.getElementById('blocker-count').textContent = data.blockers_count;
            document.getElementById('blocker-details').textContent =
                `${data.blockers_count} active ${data.blockers_count === 1 ? 'blocker' : 'blockers'}`;

            const completion = Math.round((health.completed / health.total_items) * 100);
            document.getElementById('completion-rate').textContent = completion + '%';
            document.getElementById('completion-bar').style.width = completion + '%';
            document.getElementById('completion-details').textContent =
                `${health.completed}/${health.total_items} items done`;

            let riskLevel = health.score >= 75 ? 'Low' : health.score >= 60 ? 'Medium' : 'High';
            let riskClass = health.score >= 75 ? 'status-good' : health.score >= 60 ? 'status-warning' : 'status-danger';
            document.getElementById('risk-level').innerHTML =
                `<span class="status-badge ${riskClass}">${riskLevel}</span>`;
        }

        function loadBlockers() {
            fetch('/api/status')
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        displayBlockers(data.blockers || []);
                    }
                })
                .catch(e => console.error(e));
        }

        function displayBlockers(blockers) {
            const list = document.getElementById('blockers-list');

            if (!blockers || blockers.length === 0) {
                list.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 20px;">No blockers detected - great job!</p>';
                return;
            }

            list.innerHTML = blockers.slice(0, 8).map((b, i) => `
                <div class="blocker-item">
                    <div class="blocker-title">${i + 1}. ${b.title || 'Unknown'}</div>
                    <div class="blocker-meta">
                        <span class="blocker-tag">${b.source || 'Unknown'}</span>
                        <span>${b.days_blocked || 0} days blocked</span>
                        <span>${b.type || 'blocker'}</span>
                    </div>
                </div>
            `).join('');
        }

        function loadTrends() {
            fetch('/api/trends')
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        updateCharts(data);
                    }
                })
                .catch(e => console.error(e));
        }

        function initCharts() {
            const ctx1 = document.getElementById('healthChart').getContext('2d');
            const ctx2 = document.getElementById('blockerChart').getContext('2d');

            healthChart = new Chart(ctx1, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Health Score %',
                        data: [],
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        tension: 0.4,
                        fill: true,
                        pointRadius: 5,
                        pointBackgroundColor: '#667eea',
                        pointBorderColor: '#fff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                            grid: { color: 'rgba(255,255,255,0.1)' },
                            ticks: { color: '#cbd5e1' }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#cbd5e1' }
                        }
                    }
                }
            });

            blockerChart = new Chart(ctx2, {
                type: 'bar',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Blocker Count',
                        data: [],
                        backgroundColor: 'rgba(239, 68, 68, 0.5)',
                        borderColor: '#ef4444',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: 'rgba(255,255,255,0.1)' },
                            ticks: { color: '#cbd5e1' }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#cbd5e1' }
                        }
                    }
                }
            });
        }

        function updateCharts(data) {
            const healthData = data.health_history || [];
            const blockerData = data.blocker_trends || [];

            if (healthData.length > 0) {
                healthChart.data.labels = healthData.map(d => d.week);
                healthChart.data.datasets[0].data = healthData.map(d => d.health);
                healthChart.update();
            }

            if (blockerData.length > 0) {
                blockerChart.data.labels = blockerData.map(d => d.week);
                blockerChart.data.datasets[0].data = blockerData.map(d => d.blocker_count);
                blockerChart.update();
            }
        }

        function submitQuery() {
            const query = document.getElementById('query-input').value;
            if (!query.trim()) return;
            askAgent(query);
        }

        function askAgent(query) {
            showLoading(true);
            document.getElementById('query-input').value = query;

            fetch('/api/query', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query })
            })
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        document.getElementById('report-content').textContent = data.report;
                        document.getElementById('report-display').classList.add('active');
                        currentTab = 'report';
                        switchTab('report');
                    }
                    showLoading(false);
                })
                .catch(e => {
                    console.error(e);
                    showLoading(false);
                });
        }

        function switchTab(tab, event) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

            if (event && event.target) {
                event.target.classList.add('active');
            } else {
                // Fallback: mark the correct tab as active
                document.querySelector(`button[onclick*="${tab}"]`)?.classList.add('active');
            }
            document.getElementById(tab).classList.add('active');
            currentTab = tab;

            if (tab === 'memory') {
                loadMemory();
            }
        }

        function loadMemory() {
            fetch('/api/memory')
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        document.getElementById('memory-content').textContent = data.summary;
                    }
                })
                .catch(e => console.error(e));
        }

        // Allow Enter key
        document.getElementById('query-input').addEventListener('keypress', e => {
            if (e.key === 'Enter') submitQuery();
        });

        // Auto-refresh every 5 minutes
        setInterval(loadDashboard, 5 * 60 * 1000);
    </script>
</body>
</html>
